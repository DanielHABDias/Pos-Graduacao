[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-crawler"
version = "0.1.0"
description = "Coletor pessoal de materiais acadêmicos do Canvas LMS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "faster-whisper>=1.2,<2",
    "httpx>=0.28,<1",
    "markdownify>=1.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
canvas-crawler = "canvas_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["canvas_crawler*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
